name: Enterprise Deployment & Rollback

on:
  workflow_call:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: false
        type: string
        default: ''
      is_rollback:
        description: 'Whether this is an emergency rollback'
        required: false
        type: boolean
        default: false
    outputs:
      deployment_url:
        description: 'The URL of the deployed Cloudflare Pages site'
        value: ${{ jobs.deploy.outputs.deployment_url }}

permissions:
  contents: write
  deployments: write
  id-token: write
  attestations: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_url: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Download Build Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Setup Rollback flag
        env:
          IS_ROLLBACK: ${{ inputs.is_rollback }}
        run: bash scripts/ci/setup_rollback_flag.sh

      - name: Version Bump for Release
        if: inputs.version_bump != ''
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: bash scripts/ci/version_bump.sh

      - name: Determine Release Information
        id: release_info
        env:
          ROLLBACK: ${{ env.ROLLBACK }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci/determine_release_info.sh

      - name: Generate Deployment Manifest
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ROLLBACK: ${{ env.ROLLBACK }}
        run: bash scripts/ci/generate_deployment_manifest.sh

      - name: Attest Web Build Outputs
        uses: actions/attest-build-provenance@bd77c50875ae5b397b745585d95cf580cfecbebc # v2.2.0
        with:
          subject-path: 'dist/client/**/*'

      - name: Attest Deployment Manifest
        uses: actions/attest-build-provenance@bd77c50875ae5b397b745585d95cf580cfecbebc # v2.2.0
        with:
          subject-path: 'releases/manifest-${{ env.VERSION }}.json'

      - name: Verify Attestations (Integrity Gate)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/verify_attestations.sh

      - name: Commit Release Manifest
        timeout-minutes: 5
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci/commit_release_manifest.sh

      - name: Deploy to Cloudflare Pages (IaC)
        id: cloudflare_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/deploy_production.sh

      - name: Run Playwright Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: bash scripts/ci/run_smoke_tests.sh
