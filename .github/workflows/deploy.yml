name: Enterprise Deployment & Rollback

on:
  workflow_call:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: false
        type: string
        default: ''
      is_rollback:
        description: 'Whether this is an emergency rollback'
        required: false
        type: boolean
        default: false
    outputs:
      deployment_url:
        description: 'The URL of the deployed Cloudflare Pages site'
        value: ${{ jobs.deploy.outputs.deployment_url }}

permissions:
  contents: write
  deployments: write
  id-token: write
  attestations: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Download Build Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Setup Rollback flag
        run: |
          if [ "${{ inputs.is_rollback }}" = "true" ]; then
            echo "ROLLBACK=true" >> $GITHUB_ENV
          else
            echo "ROLLBACK=false" >> $GITHUB_ENV
          fi

      - name: Version Bump for Release
        if: inputs.version_bump != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Determine Release Information
        id: release_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$ROLLBACK" = "true" ]; then
            VERSION="${VERSION}-rollback-${{ github.sha }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Deployment Manifest
        run: |
          mkdir -p releases
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<MANIFEST > releases/manifest-${{ env.VERSION }}.json
          {
            "version": "${{ env.VERSION }}",
            "commit": "${{ github.sha }}",
            "date": "$DATE",
            "trigger": "${{ github.event_name }}",
            "rollback": ${ROLLBACK:-false},
            "infrastructure": {
              "provider": "Cloudflare Pages",
              "project": "qrcraftly",
              "compatibility_date": "2024-09-23"
            }
          }
          MANIFEST

      - name: Attest Web Build Outputs
        uses: actions/attest-build-provenance@bd77c50875ae5b397b745585d95cf580cfecbebc # v2.2.0
        with:
          subject-path: 'dist/client/**/*'

      - name: Attest Deployment Manifest
        uses: actions/attest-build-provenance@bd77c50875ae5b397b745585d95cf580cfecbebc # v2.2.0
        with:
          subject-path: 'releases/manifest-${{ env.VERSION }}.json'

      - name: Verify Attestations (Integrity Gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Verify the attestation of the deployment manifest
          gh attestation verify releases/manifest-${{ env.VERSION }}.json --repo ${{ github.repository }}
          # Verify attestation for a primary web build asset as a proxy for the whole directory
          gh attestation verify dist/client/index.html --repo ${{ github.repository }}

      - name: Commit Release Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json releases/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): version ${{ env.VERSION }} [skip ci]"
          else
            echo "No changes to commit"
            exit 0
          fi

          # Determine branch dynamically
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "HEAD" ]; then
            BRANCH=$(git branch --show-current)
          fi
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then
            BRANCH="${{ github.ref_name }}"
          fi
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          echo "Determined branch: $BRANCH"

          # Retry & Rebase Loop (up to 5 times)
          SUCCESS=false
          MAX_RETRIES=5
          for (( i=1; i<=MAX_RETRIES; i++ )); do
            echo "Attempt $i of $MAX_RETRIES..."
            
            # Fetch latest branch history to resolve stale states
            if ! git fetch origin "$BRANCH"; then
              echo "git fetch failed"
              sleep 2
              continue
            fi
            
            # Rebase local version commits onto the newly retrieved head of the branch
            if ! git rebase origin/"$BRANCH"; then
              echo "git rebase failed, aborting"
              git rebase --abort
              sleep 2
              continue
            fi
            
            # Push the release updates
            if git push origin HEAD:"$BRANCH"; then
              echo "Push successful!"
              SUCCESS=true
              break
            else
              echo "git push failed"
              sleep 2
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "Failed to rebase and push after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages (IaC)
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=qrcraftly --branch=main

      - name: Run Playwright Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/smoke.spec.ts --project=chromium
