name: PR Title

# dev is squash-merged, so each PR title becomes one commit subject on dev and one
# line in the changelog. The release engine derives the SemVer bump from those
# subjects, so they must be Conventional Commits.

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(scanner): handle empty frames'. See RELEASING.md."
            echo "Got: $PR_TITLE"
            exit 1
          fi
