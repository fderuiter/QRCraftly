name: Release

# Publishes a release after a maintainer runs `pnpm run release:promote`, which
# fast-forwards main to the reviewed release commit on dev and pushes the
# annotated tag vX.Y.Z in one atomic push. See RELEASING.md.
#
# This workflow never pushes to a branch. Cloudflare Workers Builds deploys main
# to production on its own; this workflow verifies the tag, publishes the GitHub
# Release, waits for production to serve the new version, and smoke tests it.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish and verify, e.g. v0.9.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify Tag & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag matches package.json and is on main
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $VERSION."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "::error::$RELEASE_TAG must be an annotated tag (use pnpm run release:promote)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main; then
            echo "::error::$RELEASE_TAG is not on main. Promote the release commit before tagging."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: node scripts/release_engine.js --notes "$RELEASE_VERSION" > "$RUNNER_TEMP/release_notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md" --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md" --latest
          fi

  smoke-tests:
    name: Production Smoke Tests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base_url:
          - https://qrcraftly.fpderuiter.workers.dev
          - https://qrcraftly.com
    steps:
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Wait for production to serve this release
        env:
          BASE_URL: ${{ matrix.base_url }}
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/ci/wait_for_deploy.sh

      - name: Run Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ matrix.base_url }}
        run: bash scripts/ci/run_smoke_tests.sh
