name: "Copilot Setup Steps"

# Re-evaluate the workspace layout automatically if this definition is updated
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # CRITICAL: This exact job key name is required by GitHub Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Avoid running an auto-install before setup-node configures caching
          run_install: false 

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0" # Required for pnpm v11
          cache: "pnpm"      # Instructs the runner to capture pnpm global content stores

      - name: Install Project Dependencies
        # Enforces a clean, reproducible terminal footprint via your lockfile topology
        run: pnpm install --frozen-lockfile
