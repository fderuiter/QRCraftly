name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths: &workflow_paths
      - 'src/**'
      - 'src/layouts/index.css'
      - 'public/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'vitest.setup.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'lighthouserc.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # JOB 1: Install Deps & Cache
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  # JOB 2: Consolidated Static Validation Quality Gate
  static-validation:
    name: Consolidated Static Validation
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: Run Sequential Static Validation
        run: pnpm run lint

      - name: Run Secret Scanning Guardrail
        if: steps.changed-files.outputs.any_changed == 'true'
        run: node scripts/secret-scanner.js ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Semgrep
        run: pip install -r requirements.txt

      - name: Run Semgrep
        run: semgrep ci --config=semgrep.yml --metrics=off --disable-version-check
        env:
          SEMGREP_APP_TOKEN: "" # Local run only

  # JOB 3: Unit Tests
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm exec vitest run --coverage

      - name: "Report Coverage"
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2

  # JOB E2E: Playwright Cross-Browser Tests
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14



  # JOB 5: Build Application
  build:
    name: Build & Artifact
    needs: [static-validation, test, e2e] # Wait for quality checks before burning CPU on build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm run build

      - name: Check Bundle Size
        run: node scripts/check-bundle-size.js

      - name: Generate Resource Quota Report
        if: github.event_name == 'pull_request'
        run: node scripts/resource-quota-report.js

      - name: Post Resource Quota Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quota-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Run Lighthouse CI
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Post Lighthouse Comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LINKS: ${{ steps.lighthouse_audit.outputs.links }}
          MANIFEST: ${{ steps.lighthouse_audit.outputs.manifest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let links = {};
            let manifest = [];
            try {
              links = process.env.LINKS ? JSON.parse(process.env.LINKS) : {};
            } catch (e) {
              console.log('Error parsing process.env.LINKS:', e);
            }
            try {
              manifest = process.env.MANIFEST ? JSON.parse(process.env.MANIFEST) : [];
            } catch (e) {
              console.log('Error parsing process.env.MANIFEST:', e);
            }

            // Always print the report links to the pull request/workflow check log
            if (manifest && manifest.length > 0) {
              console.log('\n======================================================================');
              console.log('⚡️ LIGHTHOUSE AUDIT REPORT LINKS FOR THIS BUILD ⚡️');
              manifest.forEach((result) => {
                const reportUrl = links[result.url];
                if (reportUrl) {
                  console.log(`- URL: ${result.url}`);
                  console.log(`  Report: ${reportUrl}`);
                }
              });
              console.log('======================================================================\n');
            } else {
              console.log('No Lighthouse manifest found or Lighthouse audit was not completed.');
            }

            if (context.eventName === 'pull_request') {
              if (!manifest || manifest.length === 0) {
                 core.setFailed('Lighthouse MANIFEST is missing or empty. Please check the Lighthouse CI action logs.');
                 return;
              }

              const formatScore = (score) => Math.round(score * 100);
              const scoreIcon = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';

              let comment = '## ⚡️ Lighthouse Report\n\n';

              manifest.forEach((result) => {
                const summary = result.summary;
                const reportUrl = links[result.url];

                comment += `### URL: ${result.url}\n`;
                if (reportUrl) comment += `[View Full Report](${reportUrl})\n\n`;

                comment += '| Category | Score |\n';
                comment += '| --- | --- |\n';

                ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'].forEach(key => {
                  if (summary[key] !== undefined) {
                     const score = summary[key];
                     comment += `| ${key} | ${scoreIcon(score)} ${formatScore(score)} |\n`;
                  }
                });
                comment += '\n';
              });

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      # UPLOAD ARTIFACT for Deployment
      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy
    needs: [static-validation, test, e2e, build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Revert'))
    permissions:
      attestations: write
      contents: write
      deployments: write
      id-token: write
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      version_bump: ${{ github.event.inputs.version_bump || '' }}
      is_rollback: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Revert') }}
    secrets: inherit

