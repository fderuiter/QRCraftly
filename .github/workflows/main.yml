name: CI/CD Pipeline

on:
  push:
    branches: [dev]
    paths: &workflow_paths
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'tests/**'
      - 'functions/**'
      - 'docs/**'
      - '*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - 'knip.json'
      - '.jscpd.json'
      - '.dependency-cruiser.cjs'
      - 'semgrep.yml'
      - 'requirements.txt'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'vitest.setup.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'playwright.dev.config.ts'
      - 'lint-staged.config.js'
      - '.husky/**'
      - '.nvmrc'
      - '.node-version'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitleaks.toml'
      - '.github/rulesets/**'
      - 'lighthouserc.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [dev]
  workflow_dispatch:
    # Manual trigger for re-running CI without a code push. Releases are cut locally
    # (see RELEASING.md); .github/workflows/release.yml only publishes a pushed tag.

permissions:
  contents: read

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # JOB 1: Install Deps & Cache
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

  # Reported as its own check so a new upstream advisory flags the PR without
  # skipping lint, tests, and build (no other job depends on this one).
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  # JOB 2: Consolidated Static Validation Quality Gate
  static-validation:
    name: Consolidated Static Validation
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: Run Sequential Static Validation
        run: pnpm run lint

      - name: Run ShellCheck Static Analysis
        run: shellcheck scripts/ci/*.sh

      - name: Run Secret Scanning Guardrail
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: node scripts/secret-scanner.js

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Semgrep
        run: pip install -r requirements.txt

      - name: Run Semgrep
        run: semgrep ci --config=semgrep.yml --metrics=off --disable-version-check
        env:
          SEMGREP_APP_TOKEN: "" # Local run only

  # JOB 3: Unit Tests
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm exec vitest run --coverage
        env:
          VITEST_COVERAGE: "true"

      - name: "Report Coverage"
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2

  # JOB E2E: Playwright Cross-Browser Tests
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14



  # JOB 5: Build Application
  build:
    name: Build
    needs: [static-validation, test, e2e] # Wait for quality checks before burning CPU on build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm run build

      - name: Check Bundle Size
        run: node scripts/check-bundle-size.js

      - name: Generate Resource Quota Report
        if: github.event_name == 'pull_request'
        run: node scripts/resource-quota-report.js

      - name: Post Resource Quota Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quota-report.md', 'utf8');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.error("Warning: Failed to post Resource Quota comment due to a GitHub API error:", error);
            }

      - name: Run Lighthouse CI
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          # Generated by scripts/generate_lhci_manifest.js during postbuild from the
          # tracked lighthouserc.json base config plus the pre-rendered routes.
          configPath: "./dist/lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Post Lighthouse Comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LINKS: ${{ steps.lighthouse_audit.outputs.links }}
          MANIFEST: ${{ steps.lighthouse_audit.outputs.manifest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let links = {};
            let manifest = [];
            try {
              links = process.env.LINKS ? JSON.parse(process.env.LINKS) : {};
            } catch (e) {
              console.log('Error parsing process.env.LINKS:', e);
            }
            try {
              manifest = process.env.MANIFEST ? JSON.parse(process.env.MANIFEST) : [];
            } catch (e) {
              console.log('Error parsing process.env.MANIFEST:', e);
            }

            // Always print the report links to the pull request/workflow check log
            if (manifest && manifest.length > 0) {
              console.log('\n======================================================================');
              console.log('⚡️ LIGHTHOUSE AUDIT REPORT LINKS FOR THIS BUILD ⚡️');
              manifest.forEach((result) => {
                const reportUrl = links[result.url];
                if (reportUrl) {
                  console.log(`- URL: ${result.url}`);
                  console.log(`  Report: ${reportUrl}`);
                }
              });
              console.log('======================================================================\n');
            } else {
              console.log('No Lighthouse manifest found or Lighthouse audit was not completed.');
            }

            if (context.eventName === 'pull_request') {
              if (!manifest || manifest.length === 0) {
                 core.setFailed('Lighthouse MANIFEST is missing or empty. Please check the Lighthouse CI action logs.');
                 return;
              }

              const formatScore = (score) => Math.round(score * 100);
              const scoreIcon = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';

              let comment = '## ⚡️ Lighthouse Report\n\n';

              manifest.forEach((result) => {
                const summary = result.summary;
                const reportUrl = links[result.url];

                comment += `### URL: ${result.url}\n`;
                if (reportUrl) comment += `[View Full Report](${reportUrl})\n\n`;

                comment += '| Category | Score |\n';
                comment += '| --- | --- |\n';

                ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'].forEach(key => {
                  if (summary[key] !== undefined) {
                     const score = summary[key];
                     comment += `| ${key} | ${scoreIcon(score)} ${formatScore(score)} |\n`;
                  }
                });
                comment += '\n';
              });

              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              } catch (error) {
                console.error("Warning: Failed to post Lighthouse report comment due to a GitHub API error:", error);
              }
            }

      - name: Restore Workspace Source Metadata
        if: always()
        run: |
          git checkout -- .

  # Single required check for rulesets. Branch rules require "CI" instead of every
  # job name, so renaming or adding jobs never leaves a PR waiting on a check that
  # no longer reports. Dependency Audit stays advisory (see its comment above).
  ci:
    name: CI
    needs: [setup, static-validation, test, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with '$result'."
              exit 1
            fi
          done

  # Cloudflare Workers Builds deploys dev to staging on its own. Wait until staging
  # serves this commit, then smoke test it.
  verify-staging:
    name: Verify Preview Staging Environment
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Wait for staging to serve this commit
        env:
          BASE_URL: "https://dev-qrcraftly.fpderuiter.workers.dev"
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/wait_for_deploy.sh

      - name: Run Playwright Smoke Tests on Preview Staging
        env:
          PLAYWRIGHT_TEST_BASE_URL: "https://dev-qrcraftly.fpderuiter.workers.dev"
        run: bash scripts/ci/run_smoke_tests.sh
