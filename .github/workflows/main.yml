name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Install Deps & Cache
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"

      - name: Install NPM Dependencies
        run: pnpm install --frozen-lockfile

      # Save node_modules to be used by other jobs
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  # JOB 2: Quality Checks (Parallel)
  quality:
    name: Quality Checks
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"

      # Restore node_modules
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm run lint

  # JOB 3: Unit Tests
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm test -- run --coverage

  # JOB E2E: Playwright Cross-Browser Tests
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # JOB 5: Build Application
  build:
    name: Build & Artifact
    needs: [quality, test, e2e] # Wait for quality checks before burning CPU on build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm run build

      - name: Check Bundle Size
        run: |
          SIZE=$(du -sk dist/client | cut -f1)
          if [ $SIZE -gt 3072 ]; then
            echo "Bundle size ($SIZE KB) exceeds limit." && exit 1
          fi

      # UPLOAD ARTIFACT for Lighthouse and Deployment
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # JOB 6: Lighthouse (Consumes Build Artifact)
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for Lighthouse to comment
    steps:
      - uses: actions/checkout@v4

      # DOWNLOAD ARTIFACT
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Post Lighthouse Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LINKS: ${{ steps.lighthouse_audit.outputs.links }}
          MANIFEST: ${{ steps.lighthouse_audit.outputs.manifest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const links = process.env.LINKS ? JSON.parse(process.env.LINKS) : {};
            const manifest = process.env.MANIFEST ? JSON.parse(process.env.MANIFEST) : [];

            if (!manifest || manifest.length === 0) {
               core.setFailed('Lighthouse MANIFEST is missing or empty. Please check the Lighthouse CI action logs.');
               return;
            }

            const formatScore = (score) => Math.round(score * 100);
            const scoreIcon = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';

            let comment = '## ⚡️ Lighthouse Report\n\n';

            manifest.forEach((result) => {
              const summary = result.summary;
              const reportUrl = links[result.url];

              comment += `### URL: ${result.url}\n`;
              if (reportUrl) comment += `[View Full Report](${reportUrl})\n\n`;

              comment += '| Category | Score |\n';
              comment += '| --- | --- |\n';

              ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'].forEach(key => {
                if (summary[key] !== undefined) {
                  const score = summary[key];
                  comment += `| ${key} | ${scoreIcon(score)} ${formatScore(score)} |\n`;
                }
              });
              comment += '\n';
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
