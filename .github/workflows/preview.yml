name: PR Preview Deployments & Smoke Tests

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# Cancel in-progress runs on new commits to the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build & Deploy Preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Debug Cloudflare Credentials Presence
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "Pull request origin: Internal branch (${{ github.event.pull_request.head.repo.full_name }})"
            echo "Execution Mode: Live Cloud Deployment"
          else
            echo "Pull request origin: External fork (${{ github.event.pull_request.head.repo.full_name }})"
            echo "Execution Mode: Local Mock Preview"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty"
          else
            echo "CLOUDFLARE_API_TOKEN is present (length: ${#CLOUDFLARE_API_TOKEN})"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is empty"
          else
            echo "CLOUDFLARE_ACCOUNT_ID is present (length: ${#CLOUDFLARE_ACCOUNT_ID})"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}

      - name: Verify Package Manager and Toolchain Pins
        run: |
          # Verify pnpm version matches package.json's packageManager field
          PNPM_VERSION=$(pnpm --version)
          EXPECTED_PNPM="11.1.3"
          echo "Current pnpm version: $PNPM_VERSION"
          if [ "$PNPM_VERSION" != "$EXPECTED_PNPM" ]; then
            echo "Error: pnpm version $PNPM_VERSION does not match pinned version $EXPECTED_PNPM"
            exit 1
          fi

          # Verify Node.js version matches pinned setup configuration
          NODE_VERSION=$(node --version)
          EXPECTED_NODE="v22.14.0"
          echo "Current Node.js version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != "$EXPECTED_NODE"* ]]; then
            echo "Error: Node.js version $NODE_VERSION does not match pinned version $EXPECTED_NODE"
            exit 1
          fi

      - name: Build Application
        run: pnpm run build

      - name: Deploy Preview / Local Mock Execution
        id: cloudflare_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "Deploying preview to Cloudflare Pages (Live Cloud Deployment)..."
          else
            echo "External fork detected. Running in Local Mock Preview mode without cloud credentials..."
          fi
          pnpm exec wrangler pages deploy dist/client --project-name=qrcraftly --branch=pr-${{ github.event.pull_request.number }} --commit-dirty > deploy_output.txt 2>&1 || { cat deploy_output.txt && exit 1; }
          cat deploy_output.txt
          DEPLOYMENT_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.pages\.dev" deploy_output.txt | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL=$(grep -o "Take a look at: .*" deploy_output.txt | sed "s/Take a look at: //" | xargs)
          fi
          echo "Extracted Deployment URL: $DEPLOYMENT_URL"
          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        id: smoke_tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
        run: |
          pnpm exec playwright test e2e/smoke.spec.ts --project=chromium

      - name: Post PR Status Comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            async function withRetry(fn, maxRetries = 3, delayMs = 2000) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  return await fn();
                } catch (err) {
                  if (i === maxRetries - 1) throw err;
                  const waitTime = delayMs * Math.pow(2, i);
                  console.warn(`[Retry Warning] Attempt ${i + 1} failed. Retrying in ${waitTime}ms... Error: ${err.message}`);
                  await new Promise(resolve => setTimeout(resolve, waitTime));
                }
              }
            }

            try {
              const prNumber = context.payload.pull_request.number;
              const { owner, repo } = context.repo;
              
              const deployOutcome = "${{ steps.cloudflare_deploy.outcome }}";
              const smokeOutcome = "${{ steps.smoke_tests.outcome }}";
              
              const deployStatus = deployOutcome === 'success' ? '✅ Success' : (deployOutcome === 'skipped' ? '⏭️ Skipped' : '❌ Failed');
              const smokeStatus = smokeOutcome === 'success' ? '✅ Passed' : (smokeOutcome === 'skipped' ? '⏭️ Skipped' : '❌ Failed');
              const deploymentUrl = "${{ steps.cloudflare_deploy.outputs.deployment-url }}";

              const headRepo = context.payload.pull_request.head.repo.full_name;
              const baseRepo = context.repo.owner + '/' + context.repo.repo;
              const isInternal = headRepo === baseRepo;
              const executionMode = isInternal ? 'Live Cloud Deployment' : 'Local Mock Preview';

              // List existing comments to find previous bot comments
              const { data: comments } = await withRetry(() => github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              }));

              const botComment = comments.find(c => c.body && c.body.includes('🚀 Cloudflare Pages Preview Deployment'));

              let body = `### 🚀 Cloudflare Pages Preview Deployment\n\n`;
              body += `- **Execution Mode**: ${executionMode}\n`;
              if (deployOutcome === 'success') {
                if (isInternal && deploymentUrl.startsWith('https://')) {
                  body += `- **Staging URL**: [${deploymentUrl}](${deploymentUrl})\n`;
                } else {
                  body += `- **Local Preview URL**: ${deploymentUrl}\n`;
                }
              } else {
                body += `- **Staging URL**: *Unavailable*\n`;
              }
              body += `- **Deployment Status**: ${deployStatus}\n`;
              body += `- **Smoke Tests**: ${smokeStatus}\n`;
              body += `- **Triggered By**: @${context.actor}\n`;
              body += `- **Last Updated**: ${new Date().toISOString()}`;

              if (botComment) {
                await withRetry(() => github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: botComment.id,
                  body,
                }));
              } else {
                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body,
                  });
                } catch (createErr) {
                  const { data: latestComments } = await withRetry(() => github.rest.issues.listComments({
                    owner,
                    repo,
                    issue_number: prNumber,
                  }));
                  const existing = latestComments.find(c => c.body && c.body.includes('🚀 Cloudflare Pages Preview Deployment'));
                  if (existing) {
                    await withRetry(() => github.rest.issues.updateComment({
                      owner,
                      repo,
                      comment_id: existing.id,
                      body,
                    }));
                  } else {
                    throw createErr;
                  }
                }
              }
            } catch (err) {
              console.error('Failed to post or update PR status comment after retries:', err);
            }

  decommission-preview:
    name: Decommission Preview Staging
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decommission Preview Environment on Cloudflare Pages
        run: |
          echo "Decommissioning Cloudflare Pages preview branch pr-${{ github.event.pull_request.number }}..."
          curl -X DELETE "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/qrcraftly/branches/pr-${{ github.event.pull_request.number }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json"

      - name: Comment on Closed PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            async function withRetry(fn, maxRetries = 3, delayMs = 2000) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  return await fn();
                } catch (err) {
                  if (i === maxRetries - 1) throw err;
                  const waitTime = delayMs * Math.pow(2, i);
                  console.warn(`[Retry Warning] Attempt ${i + 1} failed. Retrying in ${waitTime}ms... Error: ${err.message}`);
                  await new Promise(resolve => setTimeout(resolve, waitTime));
                }
              }
            }

            try {
              const prNumber = context.payload.pull_request.number;
              const { owner, repo } = context.repo;
              
              const { data: comments } = await withRetry(() => github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              }));

              const decommissionComment = comments.find(c => c.body && c.body.includes('Preview Environment Decommissioned'));
              const decommissionBody = `🧹 **Preview Environment Decommissioned**\nThe dynamic staging environment for this pull request has been automatically torn down on Cloudflare Pages.`;

              if (decommissionComment) {
                await withRetry(() => github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: decommissionComment.id,
                  body: decommissionBody,
                }));
              } else {
                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: decommissionBody,
                  });
                } catch (createErr) {
                  const { data: rechecked } = await withRetry(() => github.rest.issues.listComments({
                    owner,
                    repo,
                    issue_number: prNumber,
                  }));
                  const existing = rechecked.find(c => c.body && c.body.includes('Preview Environment Decommissioned'));
                  if (!existing) throw createErr;
                }
              }
            } catch (err) {
              console.error('Failed to post decommission comment after retries:', err);
            }
