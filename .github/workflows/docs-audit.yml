name: Documentation Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Docs Audit & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Change Verification (Bypass Check)
        id: check_files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} || git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
            else
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} || git diff-tree --no-commit-id --name-only -r HEAD || true)
            fi
          fi

          echo "Detected changed files:"
          echo "$CHANGED_FILES"

          has_docs=false
          for file in $CHANGED_FILES; do
            if [ -z "$file" ]; then
              continue
            fi
            if [[ "$file" =~ ^docs/ ]] || [[ "$file" =~ \.md$ ]]; then
              echo "Documentation/markdown file detected: $file"
              has_docs=true
              break
            fi
          done

          if [ "$has_docs" = "true" ]; then
            skip=false
          else
            echo "No documentation or markdown files modified."
            skip=true
          fi

          echo "skip=$skip"
          echo "skip=$skip" >> $GITHUB_OUTPUT

      - name: Setup Environment
        if: steps.check_files.outputs.skip != 'true'
        uses: ./.github/actions/setup

      - name: Run Markdown Audit Script
        if: steps.check_files.outputs.skip != 'true'
        run: node scripts/audit_markdown.js
