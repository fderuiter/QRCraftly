name: "Setup Environment"
description: "Centralized Node and pnpm setup with robust pnpm store caching and automatic lockfile-enforced fallback installation."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm via Corepack
      run: |
        mkdir -p ~/.bin
        corepack enable --install-directory ~/.bin
        echo "$HOME/.bin" >> $GITHUB_PATH
        echo "COREPACK_HOME=$HOME/.corepack" >> $GITHUB_ENV
      shell: bash

    - name: Download & Activate pnpm
      run: |
        export COREPACK_HOME=$HOME/.corepack
        corepack prepare pnpm@11.1.3 --activate
      shell: bash

    - name: Cache pnpm store and corepack
      uses: actions/cache@v4
      with:
        path: |
          ~/.corepack
          ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-corepack-v8-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-corepack-v8-

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
