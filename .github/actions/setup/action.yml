name: "Setup Environment"
description: "Centralized Node and pnpm setup with robust pnpm store caching and automatic lockfile-enforced fallback installation."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm via npm with local prefix
      run: |
        npm install -g pnpm@11.1.3 --prefix=$HOME/.local
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: Configure pnpm store path
      run: |
        pnpm config set store-dir ~/.pnpm-store
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-v11-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v11-

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
