name: "Setup Environment"
description: "Centralized Node and pnpm setup with resilient node_modules caching and automatic lockfile-enforced fallback installation."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to restore the node_modules cache and install dependencies if there is a cache miss"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: ${{ steps.cache-node-modules.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.1.3
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Restore node_modules Cache
      if: ${{ inputs.install == 'true' }}
      id: cache-node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install Dependencies (Resilient Fallback)
      if: ${{ inputs.install == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
