name: "Setup Environment"
description: "Centralized Node and pnpm setup using prefix-isolated npm installation and robust caching."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure pnpm and Environment Variables
      run: |
        echo "pnpm_config_store_dir=$HOME/.pnpm-store" >> $GITHUB_ENV
        echo "PNPM_HOME=$HOME/.pnpm-global" >> $GITHUB_ENV
      shell: bash

    - name: Cache Pnpm Store & Global Binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.pnpm-store
          ~/.pnpm-global
        key: ${{ runner.os }}-pnpm-store-global-v19-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-global-v19-

    - name: Install pnpm globally via prefix-isolated npm
      run: |
        mkdir -p ~/.pnpm-global
        npm install -g pnpm@11.1.3 --prefix ~/.pnpm-global
        echo "$HOME/.pnpm-global/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
