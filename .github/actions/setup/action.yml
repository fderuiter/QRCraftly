name: "Setup Environment"
description: "Centralized Node and pnpm setup using custom npm global prefix for permission-safe pnpm installation and caching."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      run: |
        mkdir -p ~/.npm-global
        npm config set prefix ~/.npm-global
        echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
        npm install -g pnpm@11.1.3
      shell: bash

    - name: Configure pnpm Store
      run: |
        export PATH="$HOME/.npm-global/bin:$PATH"
        pnpm config set store-dir ~/.pnpm-store
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-v12-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v12-

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: |
        export PATH="$HOME/.npm-global/bin:$PATH"
        pnpm install --frozen-lockfile
      shell: bash
