name: "Setup Environment"
description: "Centralized Node and pnpm setup using Corepack shim wrappers and robust store/binary caching."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure Corepack Environment Variables
      run: |
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> $GITHUB_ENV
        echo "COREPACK_HOME=$HOME/.corepack" >> $GITHUB_ENV
      shell: bash

    - name: Cache Corepack Archive
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.corepack
        key: ${{ runner.os }}-corepack-v13-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-corepack-v13-

    - name: Create pnpm & pnpx shims
      run: |
        mkdir -p ~/.local/bin
        
        # Create pnpm wrapper script
        cat << 'EOF' > ~/.local/bin/pnpm
        #!/bin/bash
        corepack pnpm "$@"
        EOF
        chmod +x ~/.local/bin/pnpm

        # Create pnpx wrapper script
        cat << 'EOF' > ~/.local/bin/pnpx
        #!/bin/bash
        corepack pnpx "$@"
        EOF
        chmod +x ~/.local/bin/pnpx

        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: Configure pnpm Store
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        pnpm config set store-dir ~/.pnpm-store
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-v13-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v13-

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        pnpm install --frozen-lockfile
      shell: bash
