name: "Setup Environment"
description: "Centralized Node and pnpm setup using Node-native Corepack and robust caching."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure Corepack and pnpm Environment Variables
      run: |
        echo "COREPACK_HOME=$HOME/.corepack" >> $GITHUB_ENV
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> $GITHUB_ENV
        echo "pnpm_config_store_dir=$HOME/.pnpm-store" >> $GITHUB_ENV
      shell: bash

    - name: Cache Corepack & Pnpm Store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.corepack
          ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-corepack-store-v18-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-corepack-store-v18-

    - name: Enable and Activate pnpm via Corepack
      run: |
        mkdir -p ~/.local/bin
        corepack enable --install-directory ~/.local/bin
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        COREPACK_HOME=$HOME/.corepack corepack prepare pnpm@11.1.3 --activate
      shell: bash

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
