name: "Setup Environment"
description: "Centralized Node and pnpm setup with robust pnpm store caching and automatic lockfile-enforced fallback installation."
inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "22.14.0"
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "Whether the node_modules cache was successfully restored"
    value: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fe13019f33d7b8198f34303d19c52213190b271a # v4
      with:
        version: 11.1.3
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: pnpm install --frozen-lockfile
      shell: bash
